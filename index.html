<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지구촌 어린이 AI 대화 및 캠페인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f0f2f5; user-select: none; }
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: rgba(0, 0, 0, 0.15); border-radius: 4px; }
        .chat-bg { background-color: #b2c7da; }
        .speech-bubble-left::after {
            content: ''; position: absolute; left: -8px; top: 10px;
            border-width: 5px 8px 5px 0; border-style: solid;
            border-color: transparent #ffffff transparent transparent;
        }
        .speech-bubble-right::after {
            content: ''; position: absolute; right: -8px; top: 10px;
            border-width: 5px 0 5px 8px; border-style: solid;
            border-color: transparent transparent transparent #ffe812;
        }
    </style>
</head>
<body class="h-screen w-screen flex justify-center items-center overflow-hidden p-0 sm:p-4">

    <div class="w-full sm:max-w-md h-full sm:h-[90vh] bg-white sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-gray-200">
        
        <header class="bg-[#3a1d1d] text-white px-4 py-3 flex items-center justify-between shadow-md z-20">
            <div class="flex items-center gap-3">
                <button id="back-btn" onclick="showPersonaList()" class="hidden text-white hover:text-yellow-300 transition-colors">
                    <i class="fa-solid fa-chevron-left text-xl"></i>
                </button>
                <div class="flex flex-col">
                    <h1 id="header-title" class="font-bold text-lg leading-tight text-yellow-300">지구촌 친구들</h1>
                    <span id="header-subtitle" class="text-xs text-gray-300">6학년 도덕 6단원 2~3차시</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="switchTab('chat')" id="tab-chat-btn" class="px-3 py-1 bg-yellow-400 text-amber-950 font-bold rounded-full text-xs shadow hover:bg-yellow-300">
                    <i class="fa-solid fa-comments mr-1"></i> 대화하기
                </button>
                <button onclick="switchTab('campaign')" id="tab-campaign-btn" class="px-3 py-1 bg-gray-700 text-gray-200 font-bold rounded-full text-xs shadow hover:bg-gray-600">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 캠페인 AI
                </button>
            </div>
        </header>

        <main id="view-chat" class="flex-1 flex flex-col relative overflow-hidden">
            <div id="persona-selection-screen" class="absolute inset-0 bg-gray-50 z-10 flex flex-col p-4 overflow-y-auto">
                <div class="mb-4 bg-amber-50 border border-amber-200 rounded-2xl p-4 text-amber-900 shadow-sm">
                    <h2 class="font-bold text-base mb-1 flex items-center">
                        <i class="fa-solid fa-earth-asia text-amber-600 mr-2"></i> 대화하고 싶은 친구를 선택하세요
                    </h2>
                    <p class="text-xs text-amber-700">지구촌 어린이 챗봇과 카카오톡처럼 대화하며 친구들의 어려움과 바람을 들어보세요.</p>
                </div>
                <div class="space-y-3 flex-1 pb-6" id="persona-cards-container"></div>
            </div>

            <div id="chatroom-screen" class="flex-1 chat-bg flex flex-col h-full relative">
                <div class="bg-black/20 text-white text-[11px] py-1 px-3 text-center backdrop-blur-sm">
                    <i class="fa-solid fa-lock mr-1"></i> 챗봇과의 대화는 도덕 수업 학습용으로 안전하게 진행됩니다.
                </div>
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll"></div>
                <div id="typing-indicator" class="hidden px-4 py-1 text-xs text-gray-600 italic bg-transparent">
                    <span id="typing-persona-name">친구</span>가 답변을 작성하고 있습니다...
                </div>
                <footer class="bg-white p-2 border-t border-gray-200 flex items-center gap-2 z-10">
                    <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." 
                           class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400 border border-gray-200"
                           onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()" class="bg-[#ffe812] hover:bg-yellow-400 text-amber-950 font-bold px-4 py-2.5 rounded-full text-sm shadow transition-transform active:scale-95 flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </footer>
            </div>
        </main>

        <main id="view-campaign" class="flex-1 hidden flex flex-col bg-gray-50 overflow-y-auto p-4 space-y-4">
            <div class="bg-indigo-900 text-white p-4 rounded-2xl shadow">
                <span class="text-xs bg-indigo-700 text-indigo-200 px-2 py-0.5 rounded-full font-semibold">2차시 활동</span>
                <h2 class="font-bold text-lg mt-1"><i class="fa-solid fa-palette text-yellow-300 mr-2"></i>인류애 나눔 캠페인 이미지 제작</h2>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
                <label class="block font-bold text-gray-800 text-sm">전달하고 싶은 캠페인 홍보 프롬프트</label>
                <textarea id="prompt-input" rows="3" placeholder="예: 깨끗한 물을 선물 받아 환하게 웃고 있는 아프리카 어린이들의 희망찬 모습을 담은 일러스트" class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"></textarea>
                <button id="generate-img-btn" onclick="generateCampaignImage()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> AI 캠페인 이미지 생성하기
                </button>
            </div>
            <div id="image-result-box" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center min-h-[250px] relative">
                <div id="img-placeholder" class="text-center text-gray-400 space-y-2 py-8">
                    <i class="fa-regular fa-image text-4xl text-gray-300"></i>
                    <p class="text-xs">프롬프트를 입력하고 생성 버튼을 눌러주세요.</p>
                </div>
                <div id="img-loading" class="hidden text-center space-y-3 py-8">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
                    <p class="text-xs text-indigo-700 font-semibold">AI가 캠페인 홍보 이미지를 그리고 있습니다...</p>
                </div>
                <div id="img-output-container" class="hidden w-full flex flex-col items-center space-y-3">
                    <img id="generated-image" class="w-full h-auto rounded-xl shadow border border-gray-200 object-cover" alt="캠페인 이미지">
                </div>
            </div>
        </main>
    </div>

    <script>
        // 선생님의 Firebase 설정 정보를 여기에 붙여넣으세요.
        const firebaseConfig = {
  apiKey: "AIzaSyAZ5WH2xUtsQ7tkWaSUEpNe-aYWAzSM2iw",
  authDomain: "dodukchat.firebaseapp.com",
  projectId: "dodukchat",
  storageBucket: "dodukchat.firebasestorage.app",
  messagingSenderId: "885963004523",
  appId: "1:885963004523:web:ac54a80810764603196f2e",
  measurementId: "G-LK2XYRZQK6"
};

        if (firebase.apps.length === 0) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const PERSONAS = {
            amina: {
                name: "아미나", country: "소말리아", age: "11세", category: "보건",
                avatar: "https://placehold.co/100x100/e11d48/ffffff?text=Amina",
                tagline: "아플 때 마음 놓고 치료받고 싶어요",
                systemPrompt: `너는 소말리아 11살 '아미나'야. 6학년 도덕 수업 대화 상대야. 마을에 약과 보건소가 부족해 아팠던 어려움을 설명해주고, 비속어나 장난에는 '바르고 고운 말을 써줘'라고 단호하게 교정해줘. 소말리아 보건 문제 공감으로 대화를 이끌어줘.`
            },
            raj: {
                name: "라지", country: "인도", age: "12세", category: "교육",
                avatar: "https://placehold.co/100x100/d97706/ffffff?text=Raj",
                tagline: "벽돌 공장 대신 학교에 가서 글을 읽고 싶어요",
                systemPrompt: `너는 인도 12살 '라지'야. 생계를 위해 벽돌 공장에서 일하느라 학교에 가고 싶은 바람을 전해줘. 학생이 비속어나 장난을 치면 바른 말을 사용하도록 안내하고 교육 문제에 대해 공감하게 대화를 유도해줘.`
            },
            zaid: {
                name: "자이드", country: "시리아", age: "12세", category: "난민",
                avatar: "https://placehold.co/100x100/2563eb/ffffff?text=Zaid",
                tagline: "전쟁이 없는 안전한 곳에서 살고 싶어요",
                systemPrompt: `너는 시리아 12살 '자이드'야. 난민 캠프의 어려움과 평화의 소중함을 말해줘. 장난이나 비속어에는 올바른 언어를 쓰도록 바로잡아줘.`
            },
            nyasha: {
                name: "냐샤", country: "에티오피아", age: "11세", category: "식수",
                avatar: "https://placehold.co/100x100/059669/ffffff?text=Nyasha",
                tagline: "깨끗한 물을 마음껏 마셔보고 싶어요",
                systemPrompt: `너는 에티오피아 11살 '냐샤'야. 물을 구하러 3시간을 걷는 식수 문제 상황을 알려줘. 비속어 사용 시 교정해주고 식수 문제 해결에 관심 가지도록 대화해줘.`
            },
            lucas: {
                name: "루카스", country: "아이티", age: "12세", category: "빈곤",
                avatar: "https://placehold.co/100x100/7c3aed/ffffff?text=Lucas",
                tagline: "배고픔 걱정 없이 가족들과 웃고 싶어요",
                systemPrompt: `너는 아이티 12살 '루카스'야. 빈곤 문제로 겪는 배고픔의 어려움을 나눠줘. 비속어나 논점 이탈 시 단호하고 다정하게 수업 주제로 복귀시켜줘.`
            }
        };

        let currentPersonaKey = null;
        let chatHistories = { amina: [], raj: [], zaid: [], nyasha: [], lucas: [] };

        window.onload = function() { renderPersonaCards(); showPersonaList(); };

        function renderPersonaCards() {
            const container = document.getElementById('persona-cards-container');
            container.innerHTML = '';
            Object.keys(PERSONAS).forEach(key => {
                const p = PERSONAS[key];
                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-4 shadow-sm border border-gray-200 hover:shadow-md transition-all cursor-pointer flex items-center justify-between group`;
                card.onclick = () => selectPersona(key);
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${p.avatar}" class="w-14 h-14 rounded-full object-cover border-2 border-amber-300 shadow-sm" alt="${p.name}">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-gray-900 text-base">${p.name}</span>
                                <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">${p.category}</span>
                            </div>
                            <p class="text-xs text-gray-500">${p.country} · ${p.age}</p>
                            <p class="text-xs text-gray-700 mt-1 font-medium group-hover:text-amber-600 transition-colors">"${p.tagline}"</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tab) {
            const chatView = document.getElementById('view-chat');
            const campaignView = document.getElementById('view-campaign');
            if (tab === 'chat') {
                chatView.classList.remove('hidden'); campaignView.classList.add('hidden');
            } else {
                chatView.classList.add('hidden'); campaignView.classList.remove('hidden');
            }
        }

        function showPersonaList() {
            currentPersonaKey = null;
            document.getElementById('persona-selection-screen').classList.remove('hidden');
            document.getElementById('back-btn').classList.add('hidden');
        }

        function selectPersona(key) {
            currentPersonaKey = key;
            const p = PERSONAS[key];
            document.getElementById('persona-selection-screen').classList.add('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('header-title').innerText = `${p.name} (${p.country})`;

            if (chatHistories[key].length === 0) {
                const greeting = `안녕! 나는 ${p.country}에 사는 ${p.age} ${p.name}(이)라고 해. 우리 같이 이야기 나눠볼까?`;
                chatHistories[key].push({ role: "model", text: greeting });
            }
            renderChatMessages();
        }

        function renderChatMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            if (!currentPersonaKey) return;
            const p = PERSONAS[currentPersonaKey];

            chatHistories[currentPersonaKey].forEach(msg => {
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const row = document.createElement('div');
                if (msg.role === 'model') {
                    row.className = 'flex items-start space-x-2 mb-3';
                    row.innerHTML = `
                        <img src="${p.avatar}" class="w-9 h-9 rounded-full object-cover border border-amber-300 shadow-sm flex-shrink-0">
                        <div class="flex flex-col">
                            <span class="text-xs font-semibold text-gray-700 mb-1">${p.name}</span>
                            <div class="flex items-end space-x-1">
                                <div class="bg-white text-gray-900 px-3.5 py-2 rounded-2xl rounded-tl-none text-sm shadow-sm relative speech-bubble-left max-w-[220px]">
                                    ${msg.text}
                                </div>
                                <span class="text-[10px] text-gray-500 mb-0.5">${timeStr}</span>
                            </div>
                        </div>`;
                } else {
                    row.className = 'flex justify-end items-end space-x-1 mb-3';
                    row.innerHTML = `
                        <span class="text-[10px] text-gray-500 mb-0.5">${timeStr}</span>
                        <div class="bg-[#ffe812] text-amber-950 px-3.5 py-2 rounded-2xl rounded-tr-none text-sm shadow-sm relative speech-bubble-right max-w-[220px]">
                            ${msg.text}
                        </div>`;
                }
                container.appendChild(row);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text || !currentPersonaKey) return;

            chatHistories[currentPersonaKey].push({ role: "user", text: text });
            inputEl.value = '';
            renderChatMessages();

            document.getElementById('typing-indicator').classList.remove('hidden');

            try {
                const p = PERSONAS[currentPersonaKey];
                const contents = chatHistories[currentPersonaKey].map(m => ({
                    role: m.role === 'model' ? 'model' : 'user',
                    parts: [{ text: m.text }]
                }));

                const res = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'text',
                        contents: contents,
                        systemInstruction: p.systemPrompt
                    })
                });

                if (!res.ok) throw new Error("서버 응답 오류");
                const data = await res.json();
                const reply = data.text || "미안해, 다시 말해줄래?";
                
                chatHistories[currentPersonaKey].push({ role: "model", text: reply });

                try {
                    db.collection("chat_logs").add({
                        persona: currentPersonaKey,
                        userText: text,
                        aiReply: reply,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch(e) {}

            } catch (err) {
                console.error(err);
                chatHistories[currentPersonaKey].push({ role: "model", text: "답변을 가져오지 못했어. (404 오류 시 api 폴더 구조를 확인해주세요)" });
            } finally {
                document.getElementById('typing-indicator').classList.add('hidden');
                renderChatMessages();
            }
        }

        async function generateCampaignImage() {
            const promptInput = document.getElementById('prompt-input');
            const userPrompt = promptInput.value.trim();
            if (!userPrompt) return alert("프롬프트를 입력해 주세요.");

            const btn = document.getElementById('generate-img-btn');
            const placeholder = document.getElementById('img-placeholder');
            const loading = document.getElementById('img-loading');
            const outputContainer = document.getElementById('img-output-container');

            btn.disabled = true;
            placeholder.classList.add('hidden');
            outputContainer.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                const res = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'image', prompt: userPrompt })
                });

                if (!res.ok) throw new Error("서버 응답 오류");
                const data = await res.json();
                
                if (data.imageUrl) {
                    document.getElementById('generated-image').src = data.imageUrl;
                    loading.classList.add('hidden');
                    outputContainer.classList.remove('hidden');
                } else {
                    throw new Error(data.error || "이미지 생성 실패");
                }
            } catch (err) {
                alert("이미지 생성 중 오류가 발생했습니다.");
                loading.classList.add('hidden');
                placeholder.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
